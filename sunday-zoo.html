<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日曜日の動物園 - せかい君への絵本集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EAE3D4;
    --paper-deep: #DED4BF;
    --ink: #26221C;
    --indigo: #2B4570;
    --indigo-deep: #1C2E4A;
    --persimmon: #D96C3F;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin:0;
    background:
      radial-gradient(circle at 15% 6%, rgba(201,162,75,0.10), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(43,69,112,0.08), transparent 45%),
      var(--paper);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
  }

  header {
    text-align:center;
    padding: 4.2rem 6vw 3rem;
    border-bottom: 1px solid rgba(38,34,28,0.12);
  }
  .eyebrow {
    font-size:0.75rem;
    letter-spacing:0.32em;
    color: var(--indigo);
    text-transform: uppercase;
    font-weight:700;
    margin:0 0 1rem;
  }
  h1 {
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size: clamp(2rem, 5.5vw, 3.4rem);
    margin:0 0 0.6rem;
  }
  .sub {
    color: rgba(38,34,28,0.6);
    font-size:0.95rem;
    margin:0;
  }
  .progress {
    position: sticky;
    top:0;
    z-index: 5;
    background: rgba(234,227,212,0.88);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(38,34,28,0.1);
    padding: 0.55rem 0;
    text-align:center;
    font-size:0.72rem;
    letter-spacing:0.1em;
    color: var(--indigo-deep);
  }
  #progressFill {
    color: var(--persimmon);
    font-family:'Shippori Mincho', serif;
    font-weight:700;
  }

  main {
    max-width: clamp(360px, 78vw, 1200px);
    margin: 0 auto;
    padding: 3rem 5vw 6rem;
    display:flex;
    flex-direction: column;
    gap: 3.4rem;
  }

  .page {
    scroll-margin-top: 4rem;
  }
  .tag {
    display:flex;
    align-items:center;
    gap:0.7rem;
    margin-bottom:0.8rem;
  }
  .tag .num {
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    color: var(--persimmon);
    font-size:1rem;
    min-width: 2.4rem;
  }
  .tag .label {
    font-size:0.82rem;
    color: rgba(38,34,28,0.65);
    letter-spacing:0.03em;
  }
  .frame {
    border-radius: 6px;
    overflow:hidden;
    box-shadow:
      0 14px 28px -16px rgba(28,46,74,0.4),
      0 3px 8px rgba(28,46,74,0.15);
    background: linear-gradient(160deg, var(--indigo), var(--indigo-deep));
  }

  .frame.landscape {
    aspect-ratio: 2 / 1;
    width: 100%;
  }

  .frame.landscape img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .frame img {
    width:100%;
    display:block;
  }

  footer {
    text-align:center;
    padding: 3rem 6vw 4rem;
    color: rgba(38,34,28,0.45);
    font-size:0.78rem;
    letter-spacing:0.04em;
    border-top: 1px solid rgba(38,34,28,0.1);
  }

  #toTop {
    position: fixed;
    right: 1.4rem;
    bottom: 1.4rem;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    background: var(--indigo);
    color: var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:1.1rem;
    box-shadow: 0 8px 18px -6px rgba(28,46,74,0.5);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }
  #toTop.show { opacity:1; transform:translateY(0); pointer-events:auto; }
</style>
</head>
<body>

<div class="progress">
  <span id="progressFill">1</span> / <span id="progressTotal">18</span> ページ
</div>

<header>
  <p class="eyebrow">Picture Book</p>
  <h1>日曜日の動物園</h1>
  <p class="sub">せかい君への絵本集（全18ページ）</p>
</header>

<main id="main"></main>

<footer id="siteFooter">© 2026 せかい君への絵本集</footer>

<a href="#top" id="toTop" aria-label="トップへ戻る">↑</a>

<script>
  const pages = [
    {
        "type": "cover",
        "num": 1,
        "caption": "おべんとうを持って動物園へ",
        "src": "https://lh3.googleusercontent.com/d/1yr9aNOz3xi8gigv859gPxGzNmOxJzqF2"
    },
    {
        "type": "page",
        "num": 2,
        "caption": "日曜日、動物園へ出発",
        "src": "https://lh3.googleusercontent.com/d/1VDVetxDFYS-A70-gobYQyca62q6QkZXl"
    },
    {
        "type": "page",
        "num": 3,
        "caption": "二人で作る秋のお弁当",
        "src": "https://lh3.googleusercontent.com/d/1KGE5UI9YQX0bzCBJKoY35KfsKZ6VasOI"
    },
    {
        "type": "page",
        "num": 4,
        "caption": "動物園の休憩室でお弁当",
        "src": "https://lh3.googleusercontent.com/d/1HFa1oxpzTVr1YCiNopIZeCP8fglb6Ykf"
    },
    {
        "type": "page",
        "num": 5,
        "caption": "窓の外のかわいいもの",
        "src": "https://lh3.googleusercontent.com/d/1syOAEn3IdB66WQgjVoKoXWZ5N0eBNLob"
    },
    {
        "type": "page",
        "num": 6,
        "caption": "窓辺で楽しむレッサーパンダとお弁当",
        "src": "https://lh3.googleusercontent.com/d/1f-vaLCM7nrcP8JpG09PAzKi2u71Amzch"
    },
    {
        "type": "page",
        "num": 7,
        "caption": "レッサーパンダと楽しいお昼ごはん",
        "src": "https://lh3.googleusercontent.com/d/1I6GC6Xfo3fNFHKzFuIP4VpR9lhYCkDZP"
    },
    {
        "type": "page",
        "num": 8,
        "caption": "親子でめぐる動物園の一日",
        "src": "https://lh3.googleusercontent.com/d/14aWSwiX7mld0OPspk0z7X4mPvayFgNtT"
    },
    {
        "type": "page",
        "num": 9,
        "caption": "鹿と見つめ合う午後",
        "src": "https://lh3.googleusercontent.com/d/1_jhRurfFifFolKC89BtrPwy0eZZWRK-l"
    },
    {
        "type": "page",
        "num": 10,
        "caption": "しかのつの写真コーナー",
        "src": "https://lh3.googleusercontent.com/d/1nM6vctF-BWTOJcFFdmcdLWFPlkVpwFA4"
    },
    {
        "type": "page",
        "num": 11,
        "caption": "絵本風スライダーの公園物語",
        "src": "https://lh3.googleusercontent.com/d/1baAQ8KpoYJfRzVhLazPQOyJV3wZpjCLN"
    },
    {
        "type": "page",
        "num": 12,
        "caption": "木製遊具と届かないハンドル",
        "src": "https://lh3.googleusercontent.com/d/1ZaxZK5lJgQTnCDg3BFwomgkdcjz2-e65"
    },
    {
        "type": "page",
        "num": 13,
        "caption": "すべって、もどして、またすべって",
        "src": "https://lh3.googleusercontent.com/d/1G3m9tLQOkkh8adoC66loNZCyzI1Vb16M"
    },
    {
        "type": "page",
        "num": 14,
        "caption": "木漏れ日の遊具と優しい見守り",
        "src": "https://lh3.googleusercontent.com/d/1iYT0vzuJU064_bsNOxr7A-XhiBHnHBY6"
    },
    {
        "type": "page",
        "num": 15,
        "caption": "夕暮れの公園、帰る時間",
        "src": "https://lh3.googleusercontent.com/d/1FWIACOfxAbQkdLUKhFMJ14ifbEoqI1oS"
    },
    {
        "type": "page",
        "num": 16,
        "caption": "動物園の帰り道、親子の思い出",
        "src": "https://lh3.googleusercontent.com/d/1UJsNZo3akHjXPRbLTrWlmYAO_ljE2DYz"
    },
    {
        "type": "page",
        "num": 17,
        "caption": "お弁当と動物園の約束",
        "src": "https://lh3.googleusercontent.com/d/1IW-SZQ--lgCGYClCtc4AupyQYyC4qFOt"
    },
    {
        "type": "cover",
        "num": 18,
        "caption": "動物園で迎えるおしまいの時間",
        "src": "https://lh3.googleusercontent.com/d/1n09X-zzgboUOxRI57uza-Sb6pvU3udKc"
    }
];

  const main = document.getElementById('main');

  pages.forEach((p, i) => {
    const sec = document.createElement('section');
    sec.className = 'page';
    if (i === 0) sec.id = 'top';

    const labelText = `\ud83d\udcd6 P${p.num}` + (p.caption ? ' ' + p.caption : '');
    const numLabel = String(p.num).padStart(2, '0');

    const frameClass = (p.type === 'cover') ? 'frame' : 'frame landscape';

    sec.innerHTML = `
      <div class="tag"><span class="num">${numLabel}</span><span class="label">${labelText}</span></div>
      <div class="${frameClass}"><img src="${p.src}" alt="${labelText}" loading="lazy"></div>
    `;
    main.appendChild(sec);
  });

  document.getElementById('progressTotal').textContent = pages.length;

  const sections = Array.from(document.querySelectorAll('.page'));
  const progressFill = document.getElementById('progressFill');
  const toTop = document.getElementById('toTop');

  function updateProgress(){
    let current = 1;
    for (let i = 0; i < sections.length; i++){
      const rect = sections[i].getBoundingClientRect();
      if (rect.top < window.innerHeight * 0.5) current = i + 1;
    }
    progressFill.textContent = current;
    toTop.classList.toggle('show', window.scrollY > 400);
  }
  document.addEventListener('scroll', updateProgress, { passive: true });
  updateProgress();
</script>

</body>
</html>
