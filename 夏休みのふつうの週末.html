<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夏休みのふつうの週末</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EAE3D4;
    --paper-deep: #DED4BF;
    --ink: #26221C;
    --indigo: #2B4570;
    --indigo-deep: #1C2E4A;
    --persimmon: #D96C3F;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 6%, rgba(201,162,75,0.10), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(43,69,112,0.08), transparent 45%),
      var(--paper);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
  }

  header{
    text-align:center;
    padding: 4.2rem 6vw 3rem;
    border-bottom: 1px solid rgba(38,34,28,0.12);
  }
  .eyebrow{
    font-size:0.75rem;
    letter-spacing:0.32em;
    color: var(--indigo);
    text-transform: uppercase;
    font-weight:700;
    margin:0 0 1rem;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size: clamp(2rem, 5.5vw, 3.4rem);
    margin:0 0 0.6rem;
  }
  .sub{
    color: rgba(38,34,28,0.6);
    font-size:0.95rem;
    margin:0;
  }
  .progress{
    position: sticky;
    top:0;
    z-index: 5;
    background: rgba(234,227,212,0.88);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(38,34,28,0.1);
    padding: 0.55rem 0;
    text-align:center;
    font-size:0.72rem;
    letter-spacing:0.1em;
    color: var(--indigo-deep);
  }
  #progressFill{
    color: var(--persimmon);
    font-family:'Shippori Mincho', serif;
    font-weight:700;
  }

  main{
    max-width: clamp(360px, 78vw, 1200px);
    margin: 0 auto;
    padding: 3rem 5vw 6rem;
    display:flex;
    flex-direction: column;
    gap: 3.4rem;
  }

  .page{
    scroll-margin-top: 4rem;
  }
  .tag{
    display:flex;
    align-items:center;
    gap:0.7rem;
    margin-bottom:0.8rem;
  }
  .tag .num{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    color: var(--persimmon);
    font-size:1rem;
    min-width: 2.4rem;
  }
  .tag .label{
    font-size:0.82rem;
    color: rgba(38,34,28,0.65);
    letter-spacing:0.03em;
  }
  .frame{
    border-radius: 6px;
    overflow:hidden;
    box-shadow:
      0 14px 28px -16px rgba(28,46,74,0.4),
      0 3px 8px rgba(28,46,74,0.15);
    background: linear-gradient(160deg, var(--indigo), var(--indigo-deep));
  }
  .frame img{
    width:100%;
    display:block;
  }
  .cover .frame{
    box-shadow:
      0 22px 40px -18px rgba(28,46,74,0.5),
      0 4px 10px rgba(28,46,74,0.2);
  }
  .cover .tag .label, .backcover .tag .label{
    color: var(--indigo-deep);
    font-weight:700;
  }
  .backcover .frame img{
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: top;
  }

  footer{
    text-align:center;
    padding: 3rem 6vw 4rem;
    color: rgba(38,34,28,0.45);
    font-size:0.78rem;
    letter-spacing:0.04em;
    border-top: 1px solid rgba(38,34,28,0.1);
  }

  #toTop{
    position: fixed;
    right: 1.4rem;
    bottom: 1.4rem;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    background: var(--indigo);
    color: var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:1.1rem;
    box-shadow: 0 8px 18px -6px rgba(28,46,74,0.5);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }
  #toTop.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
</style>
</head>
<body>

<div class="progress">
  <span id="progressFill">0</span> / <span id="progressTotal">0</span> ページ
</div>

<header>
  <p class="eyebrow">Picture Book</p>
  <h1>夏休みのふつうの週末</h1>
  <p class="sub">せかい君とママの物語</p>
</header>

<main id="main"></main>

<footer id="siteFooter">© 2026 せかい君とママの世界</footer>

<a href="#top" id="toTop" aria-label="トップへ戻る">↑</a>

<script>
  /* ==========================================================
     ページ内容。captionは空のままでも表示できます。
     type: "cover" | "page" | "back"
     ========================================================== */
  const pages = [
    { type: "cover", caption: "表紙", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785284158215_55856026_mLrlL.png" },
    { type: "page", num: 1, caption: "週末の始まり", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785049659045_55856026_i8Q7c.png" },
    { type: "page", num: 2, caption: "斜塔のお皿", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785049786061_55856026_d4Sb5.png" },
    { type: "page", num: 3, caption: "食事のエンジニア", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785130246326_55856026_UjA8i.png" },
    { type: "page", num: 4, caption: "Createへの駆け込み", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785130317729_55856026_iKagC.png" },
    { type: "page", num: 5, caption: "パスワード事件", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785130468022_55856026_JuBaW.png" },
    { type: "page", num: 6, caption: "粘土ケーキ作り", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785130619748_55856026_MAqSv.png" },
    { type: "page", num: 7, caption: "雷と笑い声", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785130772428_55856026_uK6g2.png" },
    { type: "page", num: 8, caption: "ひまわりの朝", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785203277936_55856026_mig5I.png" },
    { type: "page", num: 9, caption: "家の動き", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785203365359_55856026_RqstP.png" },
    { type: "page", num: 10, caption: "作品展示台", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785203449867_55856026_496ur.png" },
    { type: "page", num: 11, caption: "迷路チャレンジ", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785206984040_55856026_1oE8e.png" },
    { type: "page", num: 12, caption: "ペンの主役交代", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785207045073_55856026_sozj1.png" },
    { type: "page", num: 13, caption: "週末の振り返り", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785283688726_55856026_qa2Se.png" },
    { type: "page", num: 14, caption: "静かな交代", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785283750041_55856026_lbwuU.png" },
    { type: "page", num: 15, caption: "週末の終わり", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785283817147_55856026_dpXS2.png" },
    { type: "page", num: 16, caption: "結び", src: "https://cdn.pagepop.top/gcs/ai/gpt_image2/55856026/1785283863026_55856026_uo51K.png" },
  ];

  const main = document.getElementById('main');

  pages.forEach((p, i) => {
    const sec = document.createElement('section');
    sec.className = 'page' + (p.type === 'cover' ? ' cover' : p.type === 'back' ? ' backcover' : '');
    if (i === 0) sec.id = 'top';

    let labelText;
    if (p.type === 'cover') labelText = '🌟 表紙' + (p.caption ? ' ' + p.caption : '');
    else if (p.type === 'back') labelText = '🌟 裏表紙' + (p.caption ? ' ' + p.caption : '');
    else labelText = `📖 P${p.num}` + (p.caption ? ' ' + p.caption : '');

    const numLabel = p.type === 'page' ? String(p.num).padStart(2, '0') : (p.type === 'cover' ? '★' : '☆');

    sec.innerHTML = `
      <div class="tag"><span class="num">${numLabel}</span><span class="label">${labelText}</span></div>
      <div class="frame"><img src="${p.src}" alt="${labelText}" loading="lazy"></div>
    `;
    main.appendChild(sec);
  });

  document.getElementById('progressTotal').textContent = pages.length;

  // scroll progress
  const sections = Array.from(document.querySelectorAll('.page'));
  const progressFill = document.getElementById('progressFill');
  const toTop = document.getElementById('toTop');

  function updateProgress(){
    let current = 1;
    for (let i = 0; i < sections.length; i++){
      const rect = sections[i].getBoundingClientRect();
      if (rect.top < window.innerHeight * 0.5) current = i + 1;
    }
    progressFill.textContent = current;
    toTop.classList.toggle('show', window.scrollY > 400);
  }
  document.addEventListener('scroll', updateProgress, { passive: true });
  updateProgress();
</script>

</body>
</html>
