<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>せかい君 絵本館</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EAE3D4;
    --paper-deep: #DED4BF;
    --ink: #26221C;
    --indigo: #2B4570;
    --indigo-deep: #1C2E4A;
    --persimmon: #D96C3F;
    --gold: #C9A24B;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 15% 8%, rgba(201,162,75,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(43,69,112,0.08), transparent 45%),
      var(--paper);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* subtle paper texture via layered noise-free grain using repeating gradient */
  body::before{
    content:"";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 5.5rem 6vw 4rem;
    text-align: center;
    border-bottom: 1px solid rgba(38,34,28,0.12);
  }

  .eyebrow {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.32em;
    color: var(--indigo);
    text-transform: uppercase;
    margin: 0 0 1.1rem;
    font-weight: 700;
  }

  h1 {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 6vw, 4.2rem);
    margin: 0 0 1rem;
    color: var(--ink);
    letter-spacing: 0.04em;
    line-height: 1.25;
  }

  h1 span {
    color: var(--persimmon);
  }

  .lede {
    max-width: 34rem;
    margin: 0 auto;
    font-size: 1.02rem;
    line-height: 2;
    color: rgba(38,34,28,0.72);
  }

  .stat-row {
    margin-top: 2.4rem;
    display: flex;
    justify-content: center;
    gap: 3rem;
    flex-wrap: wrap;
  }

  .stat {
    font-family: 'Shippori Mincho', serif;
  }

  .stat .n {
    font-size: 1.9rem;
    font-weight: 700;
    color: var(--indigo);
    display: block;
  }

  .stat .l {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    color: rgba(38,34,28,0.55);
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 1280px;
    margin: 0 auto;
    padding: 4rem 6vw 7rem;
  }

  .shelf-label {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 0 0 2.6rem;
    color: var(--indigo-deep);
  }

  .shelf-label .line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(43,69,112,0.4), transparent);
  }

  .shelf-label span {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.1rem;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 2.4rem 1.8rem;
  }

  .book {
    text-decoration: none;
    color: inherit;
    display: block;
    perspective: 900px;
  }

  .book-card {
    position: relative;
    border-radius: 3px 8px 8px 3px;
    background: var(--paper-deep);
    box-shadow:
      -3px 0 0 rgba(38,34,28,0.14) inset,
      0 10px 22px -12px rgba(28,46,74,0.35),
      0 2px 4px rgba(28,46,74,0.15);
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1), box-shadow 0.35s ease;
    transform-origin: left center;
    overflow: hidden;
  }

  .book:hover .book-card,
  .book:focus-visible .book-card {
    transform: rotateY(-14deg) translateY(-6px);
    box-shadow:
      -3px 0 0 rgba(38,34,28,0.16) inset,
      -10px 16px 28px -14px rgba(28,46,74,0.5),
      0 4px 10px rgba(28,46,74,0.2);
  }

  .cover-wrap {
    aspect-ratio: 3 / 4;
    width: 100%;
    overflow: hidden;
    position: relative;
    background: linear-gradient(160deg, var(--indigo), var(--indigo-deep));
  }

  .cover-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .cover-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Shippori Mincho', serif;
    color: rgba(255,255,255,0.85);
    font-size: 0.85rem;
    text-align: center;
    padding: 1.2rem;
    line-height: 1.7;
  }

  .vol-tag {
    position: absolute;
    top: 0.6rem;
    left: 0.6rem;
    background: rgba(38,34,28,0.55);
    color: var(--paper);
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    padding: 0.28rem 0.55rem;
    border-radius: 2px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    backdrop-filter: blur(2px);
  }

  .book-title {
    margin-top: 0.75rem;
    font-size: 0.86rem;
    line-height: 1.55;
    color: var(--ink);
    font-weight: 500;
  }

  .book-title .num {
    color: var(--persimmon);
    font-family: 'Shippori Mincho', serif;
    margin-right: 0.35em;
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 3rem 6vw 4rem;
    color: rgba(38,34,28,0.45);
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    border-top: 1px solid rgba(38,34,28,0.1);
  }

  @media (prefers-reduced-motion: reduce) {
    .book-card { transition: none; }
    .book:hover .book-card { transform: none; }
  }

  @media (max-width: 480px) {
    header { padding: 3.6rem 6vw 3rem; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 1.8rem 1.1rem; }
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Picture Book Archive</p>
  <h1>せかい君<span>絵本館</span></h1>
  <p class="lede">日々のひとことから生まれた、せかい君との記録。<br>表紙をクリックすると、その絵本のページが開きます。</p>
  <div class="stat-row">
    <div class="stat"><span class="n" id="statCount">—</span><span class="l">冊 収蔵</span></div>
    <div class="stat"><span class="n">2025—</span><span class="l">制作期間</span></div>
  </div>
</header>

<main>
  <div class="shelf-label"><div class="line"></div><span>本棚</span><div class="line"></div></div>
  <div class="grid" id="grid"></div>
</main>

<footer>© せかい君と、ママの記録 · この本棚はゆっくり増えていきます</footer>

<script>
  /* ==========================================================
     ここに絵本を追加してください。
     number : 通し番号（本棚の並び順に使います）
     title  : 絵本のタイトル
     cover  : 表紙画像のURL（なければ空文字 "" でOK。プレースホルダーが出ます）
     link   : クリックしたときに開く絵本ページのURL
     ========================================================== */
  const books = [
    {
      number: 1,
      title: "わたしのルール",
      cover: "https://cdn.pagepop.top/gcs/ai/gpt_image2/56592648/1785214710059_56592648_ONx8f.png",
      link: "https://img-volc.jianpian.info/super/markdown_injector/ai_resource/56592648/1785284512504_56592648_vD1A1.html"
    },

    // ↓ ここから先はサンプルです。実際の絵本情報に書き換えて、
    //   必要な分だけコピーして増やしてください（60冊まで自由に）。
    { number: 2, title: "（タイトルをここに）", cover: "", link: "#" },
    { number: 3, title: "（タイトルをここに）", cover: "", link: "#" },
    { number: 4, title: "（タイトルをここに）", cover: "", link: "#" },
    { number: 5, title: "（タイトルをここに）", cover: "", link: "#" },
    { number: 6, title: "（タイトルをここに）", cover: "", link: "#" },
  ];

  const grid = document.getElementById('grid');
  const statCount = document.getElementById('statCount');
  statCount.textContent = books.length;

  books
    .slice()
    .sort((a, b) => a.number - b.number)
    .forEach(book => {
      const a = document.createElement('a');
      a.className = 'book';
      a.href = book.link || '#';
      if (book.link && book.link !== '#') {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      }

      const coverInner = book.cover
        ? `<img src="${book.cover}" alt="${book.title}の表紙" loading="lazy">`
        : `<div class="cover-placeholder">${book.title}</div>`;

      a.innerHTML = `
        <div class="book-card">
          <div class="cover-wrap">
            <span class="vol-tag">vol.${String(book.number).padStart(2,'0')}</span>
            ${coverInner}
          </div>
        </div>
        <div class="book-title"><span class="num">${String(book.number).padStart(2,'0')}</span>${book.title}</div>
      `;
      grid.appendChild(a);
    });
</script>

</body>
</html>
