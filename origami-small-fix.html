<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おりがみと、ちいさななおし方 - せかい君への絵本集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EAE3D4;
    --paper-deep: #DED4BF;
    --ink: #26221C;
    --indigo: #2B4570;
    --indigo-deep: #1C2E4A;
    --persimmon: #D96C3F;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin:0;
    background:
      radial-gradient(circle at 15% 6%, rgba(201,162,75,0.10), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(43,69,112,0.08), transparent 45%),
      var(--paper);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
  }

  header {
    text-align:center;
    padding: 4.2rem 6vw 3rem;
    border-bottom: 1px solid rgba(38,34,28,0.12);
  }
  .eyebrow {
    font-size:0.75rem;
    letter-spacing:0.32em;
    color: var(--indigo);
    text-transform: uppercase;
    font-weight:700;
    margin:0 0 1rem;
  }
  h1 {
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size: clamp(2rem, 5.5vw, 3.4rem);
    margin:0 0 0.6rem;
  }
  .sub {
    color: rgba(38,34,28,0.6);
    font-size:0.95rem;
    margin:0;
  }
  .progress {
    position: sticky;
    top:0;
    z-index: 5;
    background: rgba(234,227,212,0.88);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(38,34,28,0.1);
    padding: 0.55rem 0;
    text-align:center;
    font-size:0.72rem;
    letter-spacing:0.1em;
    color: var(--indigo-deep);
  }
  #progressFill {
    color: var(--persimmon);
    font-family:'Shippori Mincho', serif;
    font-weight:700;
  }

  main {
    max-width: clamp(360px, 78vw, 1200px);
    margin: 0 auto;
    padding: 3rem 5vw 6rem;
    display:flex;
    flex-direction: column;
    gap: 3.4rem;
  }

  .page {
    scroll-margin-top: 4rem;
  }
  .tag {
    display:flex;
    align-items:center;
    gap:0.7rem;
    margin-bottom:0.8rem;
  }
  .tag .num {
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    color: var(--persimmon);
    font-size:1rem;
    min-width: 2.4rem;
  }
  .tag .label {
    font-size:0.82rem;
    color: rgba(38,34,28,0.65);
    letter-spacing:0.03em;
  }
  .frame {
    border-radius: 6px;
    overflow:hidden;
    box-shadow:
      0 14px 28px -16px rgba(28,46,74,0.4),
      0 3px 8px rgba(28,46,74,0.15);
    background: linear-gradient(160deg, var(--indigo), var(--indigo-deep));
  }

  .frame.landscape {
    aspect-ratio: 2 / 1;
    width: 100%;
  }

  .frame.landscape img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .frame img {
    width:100%;
    display:block;
  }

  footer {
    text-align:center;
    padding: 3rem 6vw 4rem;
    color: rgba(38,34,28,0.45);
    font-size:0.78rem;
    letter-spacing:0.04em;
    border-top: 1px solid rgba(38,34,28,0.1);
  }

  #toTop {
    position: fixed;
    right: 1.4rem;
    bottom: 1.4rem;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    background: var(--indigo);
    color: var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:1.1rem;
    box-shadow: 0 8px 18px -6px rgba(28,46,74,0.5);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }
  #toTop.show { opacity:1; transform:translateY(0); pointer-events:auto; }
</style>
</head>
<body>

<div class="progress">
  <span id="progressFill">1</span> / <span id="progressTotal">16</span> ページ
</div>

<header>
  <p class="eyebrow">Picture Book</p>
  <h1>おりがみと、ちいさななおし方</h1>
  <p class="sub">せかい君への絵本集（全16ページ）</p>
</header>

<main id="main"></main>

<footer id="siteFooter">© 2026 せかい君への絵本集</footer>

<a href="#top" id="toTop" aria-label="トップへ戻る">↑</a>

<script>
  const pages = [
    {
        "type": "page",
        "num": 1,
        "caption": "0013  次の日",
        "src": "https://lh3.googleusercontent.com/d/1nyjD1X7f9odVT9WXG0f_D5dB-ShHbn2U"
    },
    {
        "type": "page",
        "num": 2,
        "caption": "0014 たぶん先生が気づいて",
        "src": "https://lh3.googleusercontent.com/d/1Pvb9jZfUJ4x-LMUWjK74u-L3E4hD--dz"
    },
    {
        "type": "page",
        "num": 3,
        "caption": "0011 ママ、先生に言った",
        "src": "https://lh3.googleusercontent.com/d/1BgiAyO8Ba3_Y9Na4k2IT1xkrm0BEpDvJ"
    },
    {
        "type": "page",
        "num": 4,
        "caption": "0012 今日、教室が空いたら",
        "src": "https://lh3.googleusercontent.com/d/18lztVhomIx_L47gxDxiBk2kd8yKoTJC2"
    },
    {
        "type": "page",
        "num": 5,
        "caption": "0015 折り紙は元の場所へ",
        "src": "https://lh3.googleusercontent.com/d/12TWxeiRZPBgaxumfGXNyEL8yEEaQPbWa"
    },
    {
        "type": "page",
        "num": 6,
        "caption": "0016 まちがえることもある",
        "src": "https://lh3.googleusercontent.com/d/1b4ED1NVgrVrdfI8W0EcaAoixmfLyeyDb"
    },
    {
        "type": "page",
        "num": 7,
        "caption": "0010 先生には言わないでね",
        "src": "https://lh3.googleusercontent.com/d/1k2saOVfUdyK54G6ndgkHVGDF4qjJy1EC"
    },
    {
        "type": "page",
        "num": 8,
        "caption": "0009 いたずらの年ごろだね",
        "src": "https://lh3.googleusercontent.com/d/10IK358J5NjEwQvQs6wQtOorHe2SeyoGi"
    },
    {
        "type": "page",
        "num": 9,
        "caption": "0008 かくすと、だれかがこまるよ",
        "src": "https://lh3.googleusercontent.com/d/1g126HjvXrngyGKiflnW4pwBd5cxbk_KL"
    },
    {
        "type": "page",
        "num": 10,
        "caption": "0007 せかい君は折り紙をそっと取り出し",
        "src": "https://lh3.googleusercontent.com/d/1JVL5hfr6vqs3NJStvoEzrdNcHejfxh1K"
    },
    {
        "type": "page",
        "num": 11,
        "caption": "0006ちはなちゃんは知らんぷり",
        "src": "https://lh3.googleusercontent.com/d/1q4Py__ulj0_nWtoG0-BWm0npV2mOPB6f"
    },
    {
        "type": "page",
        "num": 12,
        "caption": "0005 いやな気持ちが 少し",
        "src": "https://lh3.googleusercontent.com/d/10eXokqH-x6qk9pqbQcQoGCZwcr08TKpc"
    },
    {
        "type": "page",
        "num": 13,
        "caption": "0004 折り紙のスイッチ",
        "src": "https://lh3.googleusercontent.com/d/1XO0cfMiaAIdILJ73U5fx0t9Jmto2hlU6"
    },
    {
        "type": "page",
        "num": 14,
        "caption": "0003「授業で折り紙を触らないでね」",
        "src": "https://lh3.googleusercontent.com/d/1Qv3AtrXhH1EzdUGWhht5KOWjNTTOd8b6"
    },
    {
        "type": "page",
        "num": 15,
        "caption": "0002ねこを２ひき見つけた",
        "src": "https://lh3.googleusercontent.com/d/1N-xluRXt25Fj7BDA8SBTruB19RICr52_"
    },
    {
        "type": "page",
        "num": 16,
        "caption": "0001「８００メートルくらい」と言った",
        "src": "https://lh3.googleusercontent.com/d/1FOIIvPkZvlBF1jWx_IqaZjRyg9cPAVZh"
    }
];

  const main = document.getElementById('main');

  pages.forEach((p, i) => {
    const sec = document.createElement('section');
    sec.className = 'page';
    if (i === 0) sec.id = 'top';

    const labelText = `\ud83d\udcd6 P${p.num}` + (p.caption ? ' ' + p.caption : '');
    const numLabel = String(p.num).padStart(2, '0');

    const frameClass = 'frame';

    sec.innerHTML = `
      <div class="tag"><span class="num">${numLabel}</span><span class="label">${labelText}</span></div>
      <div class="${frameClass}"><img src="${p.src}" alt="${labelText}" loading="lazy"></div>
    `;
    main.appendChild(sec);
  });

  document.getElementById('progressTotal').textContent = pages.length;

  const sections = Array.from(document.querySelectorAll('.page'));
  const progressFill = document.getElementById('progressFill');
  const toTop = document.getElementById('toTop');

  function updateProgress(){
    let current = 1;
    for (let i = 0; i < sections.length; i++){
      const rect = sections[i].getBoundingClientRect();
      if (rect.top < window.innerHeight * 0.5) current = i + 1;
    }
    progressFill.textContent = current;
    toTop.classList.toggle('show', window.scrollY > 400);
  }
  document.addEventListener('scroll', updateProgress, { passive: true });
  updateProgress();
</script>

</body>
</html>
